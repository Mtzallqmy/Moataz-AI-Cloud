openapi: 3.1.0
info:
  title: Moataz AI Cloud API
  version: 1.1.0
servers:
  - url: https://moataz-ai-cloud.vercel.app/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
    CredentialMetadata:
      type: object
      properties:
        id: {type: string, format: uuid}
        provider_id: {type: string, format: uuid}
        label: {type: string}
        source: {type: string, enum: [database, environment]}
        key_mask: {type: [string, 'null'], description: Masked display only; plaintext and ciphertext are never returned.}
        secret_ref: {type: [string, 'null'], description: Legacy environment-variable name only.}
        enabled: {type: boolean}
        priority: {type: integer}
        health_status: {type: string}
        last_checked_at: {type: [string, 'null'], format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        failure_count: {type: integer}
paths:
  /config:
    get:
      summary: Public remote app config
      responses: {'200': {description: Public configuration}}
  /me:
    get:
      summary: Current user and plan
      security: [{bearerAuth: []}]
      responses: {'200': {description: Account summary}, '401': {description: Authentication required}}
  /dashboard:
    get:
      summary: Aggregated Android dashboard
      security: [{bearerAuth: []}]
      responses: {'200': {description: Dashboard}}
  /usage:
    get:
      summary: Current user's usage
      security: [{bearerAuth: []}]
      responses: {'200': {description: Usage summary}}
  /providers:
    get:
      summary: Allowed managed providers
      security: [{bearerAuth: []}]
      responses: {'200': {description: Providers}}
  /models:
    get:
      summary: Allowed models
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: provider
          schema: {type: string, format: uuid}
      responses: {'200': {description: Models}}
  /chat:
    post:
      summary: Managed non-streaming chat
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {'200': {description: Chat completion}, '429': {description: Rate/quota exceeded}}
  /chat/stream:
    post:
      summary: Managed SSE chat
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {'200': {description: SSE stream, content: {text/event-stream: {}}}}
  /files/upload-url:
    post:
      summary: Create private signed upload URL
      security: [{bearerAuth: []}]
      responses: {'200': {description: Signed upload target}}
  /conversations:
    get:
      summary: List owned cloud conversations
      security: [{bearerAuth: []}]
      responses: {'200': {description: Conversations}}
    post:
      summary: Create cloud conversation
      security: [{bearerAuth: []}]
      responses: {'201': {description: Conversation created}}
  /conversations/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Read owned conversation
      security: [{bearerAuth: []}]
      responses: {'200': {description: Conversation}, '404': {description: Not found}}
    delete:
      summary: Delete owned conversation
      security: [{bearerAuth: []}]
      responses: {'204': {description: Deleted}}
  /admin/providers:
    get:
      summary: Admin provider list
      security: [{bearerAuth: []}]
      responses: {'200': {description: Provider metadata and credential counts}, '403': {description: Admin required}}
    post:
      summary: Create OpenAI-compatible provider
      security: [{bearerAuth: []}]
      responses: {'201': {description: Provider created}, '409': {description: Duplicate slug}, '422': {description: Validation error}}
    patch:
      summary: Update provider, failover and allowed plans
      security: [{bearerAuth: []}]
      responses: {'200': {description: Provider updated}}
    delete:
      summary: Delete provider with no usage history
      security: [{bearerAuth: []}]
      responses: {'200': {description: Deleted}, '409': {description: Disable provider instead when usage history exists}}
  /admin/credentials:
    get:
      summary: List credential metadata only
      description: Never returns plaintext API keys or encrypted_api_key.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Credential metadata
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
    post:
      summary: Add API credential
      description: Database source is the default. API key is accepted once and encrypted server-side using AES-256-GCM.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, label, source]
              properties:
                provider_id: {type: string, format: uuid}
                label: {type: string}
                source: {type: string, enum: [database, environment], default: database}
                api_key: {type: string, writeOnly: true}
                secret_ref: {type: string, description: Legacy environment source only.}
                enabled: {type: boolean, default: true}
                priority: {type: integer, default: 100}
      responses: {'201': {description: Credential metadata only}, '422': {description: Validation error}}
  /admin/credentials/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Update, enable/disable, reprioritize or replace a credential
      description: For rotation send a new api_key. The old key is never returned.
      security: [{bearerAuth: []}]
      responses: {'200': {description: Updated credential metadata}}
    delete:
      summary: Delete a credential
      security: [{bearerAuth: []}]
      responses: {'200': {description: Deleted; may include warning if it was the last active credential}}
  /admin/credentials/{id}/test:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Test credential server-side
      description: Uses the provider /models endpoint where supported. Never exposes the API key or provider response body.
      security: [{bearerAuth: []}]
      responses: {'200': {description: Connection test result}, '401': {description: Authentication failed}, '429': {description: Provider rate limited}}
